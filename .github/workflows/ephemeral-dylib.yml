name: Ephemeral multi-SDK dylib (ether)

# Public ether runner. Source is never committed here.
# Success → .dylib on private alzscriptz/compiler Releases
# Failure → last-error.txt on private compiler Releases (for site Copy button)
# always() scrubs workspace; does not publish source to ether
#
# Supported SDKs (client_payload.sdk or inputs.sdk):
#   iphoneos (default) | iphonesimulator | macosx
#   appletvos | appletvsimulator | watchos | watchsimulator
#   xros | xrsimulator

on:
  repository_dispatch:
    types: [build-dylib]
  workflow_dispatch:
    inputs:
      source_code:
        description: "C/Objective-C source code"
        required: false
        type: string
      source_b64:
        description: "Base64-encoded source (preferred)"
        required: false
        type: string
      filename:
        description: "Output dylib name (without .dylib)"
        required: false
        default: "libexample"
        type: string
      sdk:
        description: "Apple SDK to target"
        required: false
        default: "iphoneos"
        type: choice
        options:
          - iphoneos
          - iphonesimulator
          - macosx
          - appletvos
          - appletvsimulator
          - watchos
          - watchsimulator
          - xros
          - xrsimulator

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout ether runner only
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create isolated source (no echo of body)
        env:
          SOURCE_B64: ${{ github.event.client_payload.source_b64 || inputs.source_b64 || '' }}
          SOURCE_RAW: ${{ github.event.client_payload.source || inputs.source_code || '' }}
          FILENAME_IN: ${{ github.event.client_payload.filename || inputs.filename || 'libexample' }}
          SDK_IN: ${{ github.event.client_payload.sdk || inputs.sdk || 'iphoneos' }}
        run: |
          set -euo pipefail
          WORKDIR="/tmp/ether-dylib-$$"
          mkdir -p "$WORKDIR/src"
          echo "WORKDIR=$WORKDIR" >> "$GITHUB_ENV"

          if [ -n "$SOURCE_B64" ]; then
            printf '%s' "$SOURCE_B64" | base64 -d > "$WORKDIR/src/lib.m"
          elif [ -n "$SOURCE_RAW" ]; then
            printf '%s' "$SOURCE_RAW" > "$WORKDIR/src/lib.m"
          else
            echo "ERROR: No source code provided" > "$WORKDIR/compile-error.txt"
            echo "ERROR: No source code provided" >&2
            exit 1
          fi

          FILENAME=$(printf '%s' "$FILENAME_IN" | tr -cd '[:alnum:]_-')
          [ -n "$FILENAME" ] || FILENAME="libexample"
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"

          # Normalize / validate requested SDK
          SDK_NAME=$(printf '%s' "$SDK_IN" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]')
          case "$SDK_NAME" in
            iphoneos|iphonesimulator|macosx|appletvos|appletvsimulator|watchos|watchsimulator|xros|xrsimulator) ;;
            mac|macos|osx|darwin) SDK_NAME="macosx" ;;
            ios|iphone) SDK_NAME="iphoneos" ;;
            iossim|sim) SDK_NAME="iphonesimulator" ;;
            tvos|appletv) SDK_NAME="appletvos" ;;
            tvossim) SDK_NAME="appletvsimulator" ;;
            watch) SDK_NAME="watchos" ;;
            watchsim) SDK_NAME="watchsimulator" ;;
            visionos|xr) SDK_NAME="xros" ;;
            visionossim|xrsim) SDK_NAME="xrsimulator" ;;
            *)
              echo "ERROR: Unsupported SDK '$SDK_IN'. Allowed: iphoneos iphonesimulator macosx appletvos appletvsimulator watchos watchsimulator xros xrsimulator" > "$WORKDIR/compile-error.txt"
              cat "$WORKDIR/compile-error.txt" >&2
              exit 1
              ;;
          esac
          echo "SDK_NAME=$SDK_NAME" >> "$GITHUB_ENV"

          if grep -q "FindBestWindowForOverlay();" "$WORKDIR/src/lib.m" && ! grep -q "^static UIWindow \*FindBestWindowForOverlay(void);" "$WORKDIR/src/lib.m"; then
            tmp="$WORKDIR/src/lib.m.fixed"
            {
              printf '%s\n' '#import <UIKit/UIKit.h>'
              printf '%s\n' '#import <QuartzCore/QuartzCore.h>'
              printf '%s\n' ''
              printf '%s\n' 'static UIWindow *FindBestWindowForOverlay(void);'
              printf '%s\n' 'static void AttachOverlayAttempt(NSUInteger attempt);'
              printf '%s\n' 'static void attachOverlayToWindow(void);'
              printf '%s\n' ''
              cat "$WORKDIR/src/lib.m"
            } > "$tmp"
            mv "$tmp" "$WORKDIR/src/lib.m"
          fi

          perl -0pi -e 's/(\?\s*:\s*)""/$1\@""/g; s/(\?\?\s*)""/$1\@""/g' "$WORKDIR/src/lib.m"
          # Never print source — only size
          echo "Source bytes: $(wc -c < "$WORKDIR/src/lib.m" | tr -d ' ')"
          echo "Target SDK: $SDK_NAME"

      - name: Validate + compile dylib for selected Apple SDK
        id: compile
        run: |
          set -euo pipefail

          # Resolve SDK path + clang; fail clearly if the platform is missing on the runner
          if ! SDK=$(xcrun --sdk "$SDK_NAME" --show-sdk-path 2>/dev/null); then
            echo "ERROR: SDK '$SDK_NAME' is not available on this Xcode. Install the corresponding platform in Xcode → Settings → Platforms." > "$WORKDIR/compile-error.txt"
            cat "$WORKDIR/compile-error.txt" >&2
            exit 1
          fi
          CLANG=$(xcrun --sdk "$SDK_NAME" -f clang)

          # Per-SDK defaults (arch + deployment flag)
          ARCH="arm64"
          MINFLAG=""
          case "$SDK_NAME" in
            iphoneos)
              ARCH="arm64"
              MINFLAG="-miphoneos-version-min=14.0"
              ;;
            iphonesimulator)
              ARCH="arm64"
              MINFLAG="-miphonesimulator-version-min=14.0"
              ;;
            macosx)
              ARCH="arm64"
              MINFLAG="-mmacosx-version-min=11.0"
              ;;
            appletvos)
              ARCH="arm64"
              MINFLAG="-mappletvos-version-min=14.0"
              ;;
            appletvsimulator)
              ARCH="arm64"
              MINFLAG="-mappletvsimulator-version-min=14.0"
              ;;
            watchos)
              ARCH="arm64"
              MINFLAG="-mwatchos-version-min=7.0"
              ;;
            watchsimulator)
              ARCH="arm64"
              MINFLAG="-mwatchsimulator-version-min=7.0"
              ;;
            xros)
              ARCH="arm64"
              MINFLAG="-mxros-version-min=1.0"
              ;;
            xrsimulator)
              ARCH="arm64"
              MINFLAG="-mxrsimulator-version-min=1.0"
              ;;
          esac

          # Base frameworks differ slightly by platform family
          case "$SDK_NAME" in
            macosx)
              FRAMEWORK_ARGS=(-framework Foundation -framework AppKit -framework QuartzCore)
              ;;
            *)
              FRAMEWORK_ARGS=(-framework Foundation -framework UIKit -framework QuartzCore)
              ;;
          esac

          while IFS= read -r framework; do
            [ -n "$framework" ] || continue
            case "$framework" in Foundation|UIKit|AppKit|QuartzCore|Darwin|objc|os) continue;; esac
            if [ -d "$SDK/System/Library/Frameworks/$framework.framework" ] || [ -d "$SDK/System/Library/PrivateFrameworks/$framework.framework" ]; then
              already=0
              for existing in "${FRAMEWORK_ARGS[@]}"; do [ "$existing" = "$framework" ] && already=1; done
              [ "$already" -eq 0 ] && FRAMEWORK_ARGS+=(-framework "$framework")
            fi
          done < <(
            {
              sed -nE 's/^[[:space:]]*#import[[:space:]]*[<"]([A-Za-z0-9_]+)(\/.*)?[>"][[:space:]]*$/\1/p' "$WORKDIR/src/lib.m"
              sed -nE 's/^[[:space:]]*@import[[:space:]]+([A-Za-z0-9_]+)[[:space:]]*;.*/\1/p' "$WORKDIR/src/lib.m"
            } | sort -u
          )

          ERR="$WORKDIR/compile-error.txt"
          : > "$ERR"

          echo "Using SDK: $SDK"
          echo "Using clang: $CLANG"
          echo "Arch: $ARCH  Min-flag: $MINFLAG"
          echo "Frameworks:"
          printf '  %s\n' "${FRAMEWORK_ARGS[@]}"

          set +e
          "$CLANG" \
            -arch "$ARCH" \
            -isysroot "$SDK" \
            $MINFLAG \
            -fobjc-arc \
            -fmodules \
            -fsyntax-only \
            "$WORKDIR/src/lib.m" \
            ${FRAMEWORK_ARGS[@]} \
            >"$WORKDIR/syntax.out" 2>"$WORKDIR/syntax.err"
          SYN=$?
          set -e
          if [ "$SYN" -ne 0 ]; then
            {
              echo "=== syntax / type check failed (SDK=$SDK_NAME) ==="
              sed "s|$WORKDIR/||g" "$WORKDIR/syntax.err" | tail -n 80
            } > "$ERR"
            cat "$ERR" >&2
            exit 1
          fi

          set +e
          "$CLANG" \
            -arch "$ARCH" \
            -isysroot "$SDK" \
            $MINFLAG \
            -fobjc-arc \
            -fmodules \
            -dynamiclib \
            -o "$WORKDIR/${FILENAME}.dylib" \
            "$WORKDIR/src/lib.m" \
            ${FRAMEWORK_ARGS[@]} \
            >"$WORKDIR/link.out" 2>"$WORKDIR/link.err"
          LINK=$?
          set -e
          if [ "$LINK" -ne 0 ]; then
            {
              echo "=== link / compile failed (SDK=$SDK_NAME) ==="
              sed "s|$WORKDIR/||g" "$WORKDIR/link.err" | tail -n 80
            } > "$ERR"
            cat "$ERR" >&2
            exit 1
          fi

          file "$WORKDIR/${FILENAME}.dylib"
          ls -lh "$WORKDIR/${FILENAME}.dylib"

      - name: Publish .dylib to private compiler Releases only
        if: success()
        env:
          GH_TOKEN: ${{ secrets.COMPILER_RELEASE_TOKEN }}
          TARGET_REPO: alzscriptz/compiler
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ERROR: COMPILER_RELEASE_TOKEN missing" >&2
            exit 1
          fi
          TAG="latest-build"
          DYLIB="$WORKDIR/${FILENAME}.dylib"
          # Clear previous error marker on success
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" last-error.txt --repo "$TARGET_REPO" --yes 2>/dev/null || true
            gh release upload "$TAG" "$DYLIB" --repo "$TARGET_REPO" --clobber
          else
            gh release create "$TAG" "$DYLIB" \
              --repo "$TARGET_REPO" \
              --title "Latest dylib build" \
              --notes "Built on ether (SDK=$SDK_NAME). Source never stored on ether." \
              --latest=false
          fi
          echo "Published dylib to $TARGET_REPO @$TAG (SDK=$SDK_NAME)"

      - name: Publish compile error to private compiler (for site Copy)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.COMPILER_RELEASE_TOKEN }}
          TARGET_REPO: alzscriptz/compiler
        run: |
          set -euo pipefail
          ERR="$WORKDIR/compile-error.txt"
          if [ ! -s "$ERR" ]; then
            echo "Build failed (no captured compiler message). Check Actions briefly before run is cleaned." > "$ERR"
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "COMPILER_RELEASE_TOKEN missing — cannot mirror error to compiler" >&2
            exit 0
          fi
          TAG="latest-build"
          # Ensure release exists so we can attach last-error.txt only (no dylib)
          if ! gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$TARGET_REPO" \
              --title "Latest dylib build" \
              --notes "Error-only placeholder" \
              --latest=false
          fi
          # Upload as last-error.txt for the website to fetch
          cp "$ERR" last-error.txt
          gh release upload "$TAG" last-error.txt --repo "$TARGET_REPO" --clobber
          echo "Error text mirrored to private compiler release (last-error.txt)"

      - name: Always scrub workspace (zero source on ether)
        if: always()
        run: |
          set +e
          if [ -n "${WORKDIR:-}" ]; then
            rm -rf "$WORKDIR"
          fi
          rm -rf /tmp/ether-dylib-*
          echo "Ether workspace deleted — no source left on runner"
